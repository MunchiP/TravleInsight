<h2>Primeros 10 Destinos</h2>
<ul>
  <li *ngFor="let destino of destinos">
    {{ destino.NOMBRE_ESTABLECIMIENTO }} - {{ destino.MUNICIPIO }}
  </li>
</ul>

<h2>Top Municipios</h2>
<ul>
  <li *ngFor="let municipio of topMunicipios | keyvalue">
    {{ municipio.key }}: {{ municipio.value }}
  </li>
</ul>
